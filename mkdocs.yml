site_name: NosoGraph
site_description: Disease intelligence connected across biomedical knowledge, evidence, and provenance.
site_url: https://adameddahmouni.github.io/nosograph/
repo_url: https://github.com/AdamEddahmouni/nosograph
repo_name: AdamEddahmouni/nosograph
edit_uri: edit/master/docs/
docs_dir: docs
exclude_docs: |
  style-test.md
  # Internal audit reports and historical launch checklists
  audits/
  # Internal engineering plans/specs (published in the repository, not on the site)
  superpowers/
  # Internal roadmap planning archive (public roadmap lives at project/roadmap.md)
  roadmaps/
  # Internal press-kit drafts referencing launch-copy planning material
  media/
  # Internal release-readiness process page
  public-launch.md
  # Legacy v2.x prototype lineage records (pre-public-alpha versioning; see project/releases.md)
  release-notes/v2.3.0.md
  release-notes/v2.4.0.md
  project/launch-copy.md
  project/github-discussions-seed.md
  project/github-public-settings.md
  project/adoption-metrics.md
  project/openssf-readiness.md
  project/release-notes-template.md
  project/zenodo-setup.md
  architecture/commercialization-boundaries.md
  architecture/decisions/
  # Internal engineering design for a future hosted demo (not an offered product)
  deployment/public-demo.md
  # Asset-directory READMEs are repository documentation, not site pages
  assets/brand/README.md
  # Source captures kept for the internal style fixture; superseded by WebP on public pages
  assets/screenshots/
  assets/fonts/README.md
copyright: NosoGraph is research software. Not medical advice. Apache-2.0 source license.

theme:
  name: material
  custom_dir: docs-theme
  logo: assets/brand/mark.svg
  favicon: assets/brand/favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow

extra_javascript:
  - javascripts/home.js

extra_css:
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/components.css
  - stylesheets/docs.css
  - stylesheets/home.css

plugins:
  - search

hooks:
  - scripts/site_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AdamEddahmouni/nosograph
  generator: false

nav:
  - Start:
