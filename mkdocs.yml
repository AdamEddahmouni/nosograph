      - Evidence Explorer: using/evidence-explorer.md
      - Compare conditions: using/compare.md
      - Evidence Workspace: evidence-workspace.md
      - Walkthroughs:
          - SLE: research/sle.md
          - Rheumatoid arthritis: research/ra.md
          - Alzheimer disease: research/ad.md
          - Cross-disease comparison: research/comparison.md
          - Evidence tracing: research/evidence-tracing.md
          - Drug repurposing: research/repurposing.md
      - Operate:
          - CLI: using/cli.md
          - API reference: api-reference.md
          - Source sync: using/source-sync.md
          - Validation: using/validation.md
  - Understand:
