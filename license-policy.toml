# NosoGraph License Compliance Policy
# Enforced by scripts/check_licenses.py in CI and local pre-push gates.

[policy]
project_name = "med-research"
canonical_name = "nosograph"
project_license = "Apache-2.0"

# Permissive open-source licenses compatible with Apache-2.0 distribution
allowed_licenses = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "PSF-2.0",
    "Python-2.0",
    "CC0-1.0",
    "Unlicense",
    "MIT-CMU",
    "HPND",
    "LicenseRef-Biopython-License",
    "bzip2-1.0.6",
    "Zlib",
    "BSL-1.0",
    "FTL",
]

# Weak copyleft / notice-required / dual-licensed requiring review or attribution notices
conditional_licenses = [
    "MPL-2.0",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "EPL-2.0",
    "CDDL-1.0",
]

# Forbidden licenses incompatible with Apache-2.0 distribution or commercial use
forbidden_licenses = [
    "GPL-1.0",
    "GPL-1.0-only",
    "GPL-1.0-or-later",
    "GPL-2.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-1.0",
    "AGPL-1.0-only",
    "AGPL-1.0-or-later",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "SSPL-1.0",
    "CC-BY-NC-1.0",
    "CC-BY-NC-2.0",
    "CC-BY-NC-3.0",
    "CC-BY-NC-4.0",
    "Proprietary",
]

# Package-specific exceptions with documented rationale
[exceptions]
"meeko" = { license = "LGPL-2.1-or-later", rationale = "Optional cheminformatics dependency; dynamically imported; LGPL-2.1 library linking permitted" }
"biopython" = { license = "LicenseRef-Biopython-License", rationale = "Biopython License Agreement (permissive BSD-style OSI-compliant license)" }
"matplotlib" = { license = "PSF-2.0", rationale = "Matplotlib is licensed under PSF-based open source license" }
"uvloop" = { license = "MIT", rationale = "Unix-only fast asyncio event loop (MIT licensed)" }
"nvidia-nccl-cu12" = { license = "Proprietary", rationale = "Linux-only GPU accelerator runtime; optional system binary dependency", ignore_disallowed = true }
