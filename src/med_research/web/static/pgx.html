<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGx Calculator</title>
    <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
    <div class="container">
        <h1>Pharmacogenomics (PGx) Calculator</h1>
        <p>Enter gene‑allele mappings as JSON (e.g., {"CYP2D6": ["*1","*4"], "CYP2C19": ["*2"]})</p>
        <textarea id="genotype-input" rows="6" style="width:100%;font-family:monospace;" placeholder='{"CYP2D6": ["*1","*4"]}'></textarea>
        <br/>
        <button id="submit-btn" class="btn btn-primary">Evaluate</button>
        <pre id="result" style="margin-top:1rem;background:#f8f8f8;padding:1rem;white-space:pre-wrap;"></pre>
    </div>
    <script src="/js/pgx.js"></script>
</body>
</html>
