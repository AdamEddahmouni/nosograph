{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<link rel="icon" href="{{ config.site_url }}assets/brand/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#08142D">
<meta name="description" content="{{ page.meta.description if page and page.meta and page.meta.description else config.site_description }}">
<meta property="og:title" content="{{ page.title if page and page.title else config.site_name }}">
<meta property="og:description" content="{{ page.meta.description if page and page.meta and page.meta.description else config.site_description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
<meta property="og:image" content="{{ config.site_url }}assets/brand/social-preview.svg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title if page and page.title else config.site_name }}">
<meta name="twitter:description" content="{{ page.meta.description if page and page.meta and page.meta.description else config.site_description }}">
<meta name="twitter:image" content="{{ config.site_url }}assets/brand/social-preview.svg">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareSourceCode",
  "name": "NosoGraph",
  "alternateName": "Disease Intelligence. Connected.",
  "description": "Open-source research software for connecting disease knowledge, evidence, and provenance across biomedical sources.",
  "url": "https://adameddahmouni.github.io/nosograph/",
  "codeRepository": "https://github.com/AdamEddahmouni/nosograph",
  "license": "https://www.apache.org/licenses/LICENSE-2.0",
  "programmingLanguage": "Python",
  "applicationCategory": "ResearchSoftware",
  "isAccessibleForFree": true,
  "creativeWorkStatus": "PublicAlpha"
}
</script>
{% endblock %}
