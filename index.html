<!DOCTYPE html>
<!-- Live dashboard is served by FastAPI: run `nosograph serve` then open http://127.0.0.1:8000/ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:8000/">
    <meta name="theme-color" content="#08142D">
    <title>NosoGraph — Disease Intelligence. Connected.</title>
    <style>
        :root {
            --bg: #08142d;
            --surface: #102246;
            --text: #f8fbff;
            --muted: #dce4ef;
            --accent: #19d2c7;
            --blue: #2f86ff;
            --violet: #7252f4;
        }
        body {
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
        }
        main {
            max-width: 520px;
            text-align: center;
            border: 1px solid #29466f;
            border-radius: 18px;
            padding: 40px 32px;
            background: var(--surface);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        }
        .brand-mark { width: 86px; height: 86px; }
        h1 { margin: 12px 0 4px; font-size: 2.2rem; font-weight: 400; letter-spacing: -0.05em; }
        h1 span {
            background: linear-gradient(110deg, var(--accent), var(--blue) 52%, var(--violet));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .tagline { margin: 0 0 22px; color: var(--accent); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
        p { color: var(--muted); line-height: 1.6; }
        code {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <main>
        <img class="brand-mark" src="docs/assets/brand/symbol.svg" alt="">
        <h1>Noso<span>Graph</span></h1>
        <p class="tagline">Disease Intelligence. Connected.</p>
        <p>
            The live dashboard is served by the FastAPI app, not this static file.
            Start the server with <code>nosograph serve</code>, then open
            <a href="http://127.0.0.1:8000/">http://127.0.0.1:8000/</a>.
        </p>
        <p><a href="http://127.0.0.1:8000/">Continue to dashboard →</a></p>
    </main>
</body>
</html>
