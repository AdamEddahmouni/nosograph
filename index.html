<!DOCTYPE html>
<!-- Live dashboard is served by FastAPI: run `nosograph serve` then open http://127.0.0.1:8000/ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:8000/">
    <title>NosoGraph</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --text: #e0e0e8;
            --muted: #787890;
            --accent: #818cf8;
        }
        body {
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
        }
        main {
            max-width: 520px;
            text-align: center;
            border: 1px solid #252535;
            border-radius: 12px;
            padding: 40px 32px;
            background: #13131a;
        }
        h1 { margin: 0 0 12px; font-size: 1.5rem; }
        p { color: var(--muted); line-height: 1.6; }
        code {
            background: #1a1a24;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <main>
        <h1>NosoGraph</h1>
        <p>
            The live dashboard is served by the FastAPI app, not this static file.
            Start the server with <code>nosograph serve</code>, then open
            <a href="http://127.0.0.1:8000/">http://127.0.0.1:8000/</a>.
        </p>
        <p><a href="http://127.0.0.1:8000/">Continue to dashboard →</a></p>
    </main>
</body>
</html>
