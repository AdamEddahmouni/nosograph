  <text x="230" y="190" font-family="Sora, Inter, Arial, sans-serif" font-size="64" font-weight="650" fill="#F8FBFF">Noso<tspan fill="url(#ng-gradient)">Graph</tspan></text>
  <text x="234" y="248" font-family="Sora, Inter, Arial, sans-serif" font-size="30" fill="#19D2C7">Disease Intelligence. Connected.</text>
  <text x="234" y="306" font-family="Inter, Arial, sans-serif" font-size="19" fill="#DCE4EF">Open-source research software for connecting disease knowledge,</text>
  <text x="234" y="338" font-family="Inter, Arial, sans-serif" font-size="19" fill="#DCE4EF">evidence, and provenance across biomedical sources.</text>
