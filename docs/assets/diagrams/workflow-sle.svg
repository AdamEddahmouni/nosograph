<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img">
  <title>Example: investigating SLE (research workflow)</title>
  <rect width="980" height="640" fill="#0B1524"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7FD1CF"/>
    </marker>
  </defs>
  <text x="40" y="40" fill="#7FD1CF" font-size="18" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Example: investigating SLE (research workflow)</text>
  <line x1="260" y1="105" x2="290" y2="105" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="510" y1="105" x2="540" y2="105" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="770" y1="105" x2="800" y2="105" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="360" y1="130" x2="360" y2="250" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="470" y1="275" x2="510" y2="275" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="640" y1="300" x2="480" y2="420" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="80" width="200" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="160.0" y="110.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">1. Open SLE module</text><rect x="290" y="80" width="220" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="400.0" y="110.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">2. Phenotypes & genes</text><rect x="540" y="80" width="230" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="655.0" y="110.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">3. Pathways / expression</text><rect x="800" y="80" width="150" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="875.0" y="110.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">4. Compare with RA</text><rect x="250" y="250" width="220" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="360.0" y="280.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">5. Inspect a claim</text><rect x="510" y="250" width="260" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="640.0" y="280.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">6. Trace evidence → source</text><rect x="360" y="420" width="240" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="480.0" y="450.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">7. Export / reuse</text>
</svg>
