<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img">
  <title>How NosoGraph works</title>
  <rect width="980" height="640" fill="#0B1524"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7FD1CF"/>
    </marker>
  </defs>
  <text x="40" y="40" fill="#7FD1CF" font-size="18" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">How NosoGraph works</text>
  <line x1="330" y1="105" x2="360" y2="105" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="640" y1="105" x2="680" y2="105" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="130" x2="480" y2="220" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="270" x2="480" y2="360" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="200" y1="385" x2="370" y2="385" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="590" y1="385" x2="640" y2="385" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="410" x2="480" y2="500" stroke="#7FD1CF" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="70" y="80" width="260" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="200.0" y="110.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Public biomedical sources</text><rect x="360" y="80" width="280" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="500.0" y="110.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Normalize identifiers & records</text><rect x="680" y="80" width="230" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="795.0" y="110.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Attach provenance</text><rect x="250" y="220" width="460" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="480.0" y="250.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Disease modules + universal store</text><rect x="80" y="360" width="240" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="200.0" y="390.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Research workflows</text><rect x="370" y="360" width="220" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="480.0" y="390.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Evidence tracing</text><rect x="640" y="360" width="240" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="760.0" y="390.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Disease comparison</text><rect x="300" y="500" width="360" height="50" rx="10" fill="#132536" stroke="#1B7A7A" /><text x="480.0" y="530.0" text-anchor="middle" fill="#F7F4EE" font-size="14" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">CLI / API / dashboard</text>
