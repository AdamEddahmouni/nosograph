name: Feature request
description: Suggest an enhancement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are trying to solve and how a change would help research workflows.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or workflow pain does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the platform behave after the change?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated.

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - CLI / pipeline
        - Web API / dashboard
        - Evidence workspace
        - Disease curation / knowledge graph
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This feature supports research-only, non-PHI workflows
          required: true
