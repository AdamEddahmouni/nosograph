name: Reference identifier audit

on:
  schedule:
    # Weekly audit of PMID, DOI, and ClinVar identifiers.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-identifier-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e .

      - name: Resolve reference identifiers
        run: python scripts/check_reference_identifiers.py --tier both --json reference-identifiers.json

      - name: Upload identifier audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-identifier-audit
          path: reference-identifiers.json
          if-no-files-found: warn
          retention-days: 30
