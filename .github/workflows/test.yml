name: Tests



on:

  push:

    branches: [main, master]

  pull_request:

    branches: [main, master]

  schedule:

    # Weekly slow-test run (live external API calls) — Mon 03:00 UTC

    - cron: "0 3 * * 1"

  workflow_dispatch:



jobs:

  lint:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements-dev.txt

          pip install -e .



      - name: Run ruff

        run: ruff check src tests



      - name: Typecheck expanded modules

        run: make typecheck



      - name: Verify dependency lock files are fresh

        run: make lock-check



  test:

    runs-on: ubuntu-latest

    strategy:

      matrix:

        python-version: ["3.10", "3.11", "3.12"]



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up Python ${{ matrix.python-version }}

        uses: actions/setup-python@v5

        with:

          python-version: ${{ matrix.python-version }}

          cache: pip



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install -r requirements-dev.txt

          pip install -e .  # install the med_research package itself (src layout)



      - name: Check for stale internal imports

        run: |

          python scripts/check_imports.py



      - name: Run deterministic offline tests

        timeout-minutes: 5

        run: |

          python -m pytest tests/ -m "not slow and not integration" -q --tb=short -n auto \

            --cov=src/med_research --cov-report=term-missing --cov-report=xml



      - name: Coverage threshold (informational, 80%)

        continue-on-error: true

        run: |

          python -m coverage report --fail-under=80



      - name: Verify unified CLI works

        run: |

          python -m med_research.cli --help



      - name: Verify every disease config is non-stub

        run: |

          python -m med_research.cli disease validate --all --strict



      - name: Verify knowledge graph builds

        run: |

          python -m med_research.cli kg --disease sle --export



      - name: Verify repurposing engine runs

        run: |

          python -m med_research.cli repurpose --disease sle --top 5



  integration-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 15



    services:

      redis:

        image: redis:7

        ports:

          - 6379:6379

        options: >-

          --health-cmd "redis-cli ping"

          --health-interval 10s

          --health-timeout 5s

          --health-retries 5



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install -r requirements-dev.txt

          pip install -e .



      - name: Run offline integration tests

        run: |

          python -m pytest tests/ -m "integration and not slow" -q --tb=short



  # Slow tests hit live external APIs (GWAS Catalog, STRING, Enrichr, PubMed,

  # ClinicalTrials.gov, GEO, PDB/Vina). Run them on a schedule or manually so

  # regressions are caught without blocking every PR.

  slow-tests:

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    timeout-minutes: 45



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install -r requirements-dev.txt

          python -m playwright install chromium

          pip install -e .



      - name: Run slow tests (live external API calls)

        run: |

          python -m pytest tests/ -m slow -v --tb=short



      - name: Upload Playwright failure diagnostics

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: playwright-browser-diagnostics

          path: test-artifacts/browser/

          if-no-files-found: ignore

          retention-days: 14


