name: Tests

# Public OSS: GitHub-hosted Actions are free for public repositories on
# standard runners. Private forks still consume the owner's quota.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly slow-test run (live external API calls) — Mon 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev-lock.txt
          pip install -e .

      - name: Run ruff
        run: ruff check src tests

      - name: Run ruff format check
        run: ruff format --check src tests

      - name: Verify dependency lock files are fresh
        run: make lock-check

      - name: Check for stale internal imports
        run: python scripts/check_imports.py

      - name: Check public metadata consistency
        run: python scripts/check_public_metadata.py

  # Non-blocking until TECHNICAL_DEBT_ISSUES.md typing backlog is cleared.
  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev-lock.txt
          pip install -e .

      - name: Run mypy (informational)
        run: make typecheck || true

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
          pip install -r requirements-lock.txt

      - name: Audit locked dependencies
        run: pip-audit -r requirements-lock.txt

      - name: Run bandit security scan
        run: |
          bandit -c .bandit -r src/med_research -ll \
            -x tests,src/med_research/diseases,src/med_research/pipeline/dossier

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev-lock.txt
          pip install -e .

      - name: Verify installed packages match lock
        run: python scripts/lock_verify.py

      - name: Run docking tests (no network)
        run: python -m pytest tests/test_docking.py -m "not network" -q --tb=short

      - name: Run deterministic offline tests
        timeout-minutes: 45
        run: |
          python -m pytest tests/ -m "unit and not network and not slow" -q --tb=short -n 2 \
            --ignore=tests/test_evidence_workspace_browser.py \
            --cov=src/med_research --cov-report=term-missing --cov-report=xml

      - name: Coverage threshold (80%)
        run: python -m coverage report --fail-under=80

      - name: Verify unified CLI works
        run: python -m med_research.cli --help

      - name: Verify nosograph CLI alias
        run: nosograph --help

      - name: Verify curated disease configs (not full 10k registry)
        run: |
          for id in sle ra ibd ms ss ssc t1d ad; do
            python -m med_research.cli disease validate "$id" --strict
          done

      - name: Validate reference disease batch (strict)
        run: python -m med_research.cli disease validate-batch --tier reference --strict

      - name: Platform core unit tests
        run: |
          python -m pytest tests/test_disease_identifiers.py tests/test_validation_batch.py \
            tests/biomed/sync/test_opentargets_sync.py tests/biomed/nosograph_compare/test_engine.py \
            -q --tb=short -n 0

      - name: Corpus readiness unit tests
        run: |
          python -m pytest tests/test_registry_quality.py tests/test_tier_model.py tests/test_corpus_status.py tests/test_disease_context.py tests/web/test_corpus_status_api.py tests/biomed/imports/test_clinvar_openfda_cli.py -q --tb=short

      - name: Verify knowledge graph builds
        run: python -m med_research.cli kg --disease sle --export

      - name: Verify repurposing engine runs
        run: python -m med_research.cli repurpose --disease sle --top 5

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_TASK_STORE_EAGER_RESULT: "true"
      CELERY_TASK_EAGER_PROPAGATES: "false"
      DEBUG: "true"
      RATE_LIMIT_REQUESTS: "0"
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev-lock.txt
          pip install -e .

      - name: Run offline integration tests
        run: python -m pytest tests/ -m "integration and not slow" -q --tb=short -n 0

  required-tests:
    name: Tests
    if: always()
    needs: [lint, security, test, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["REQUIRED_RESULTS"])
          results = {name: details["result"] for name, details in jobs.items()}
          print(results)
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
          PY

  slow-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev-lock.txt
          python -m playwright install chromium
          pip install -e .

      - name: Run slow tests (live external API calls)
        run: python -m pytest tests/ -m slow -v --tb=short

      - name: Strict validate full L2 corpus
        run: |
          python -m med_research.cli disease validate-batch --tier L2 --strict \
            --output data/reports/validation_l2_full.json

      - name: Upload Playwright failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browser-diagnostics
          path: test-artifacts/browser/
          if-no-files-found: ignore
          retention-days: 14
