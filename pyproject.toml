[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "med-research"
version = "2.3.0"
description = "NosoGraph — The Open Computational Map of Human Disease"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "NosoGraph contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.83",
    "celery>=5.3",
    "fastapi>=0.109",
    "gseapy>=1.1",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "pydantic>=2.5",
    "Jinja2>=3.1",
    "redis>=5.0",
    "requests>=2.31",
    "duckdb>=1.0",
    "orjson>=3.9",
    "scikit-learn>=1.4",
    "uvicorn>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "shap>=0.44"]
cheminformatics = ["rdkit>=2023.09", "meeko>=0.5", "gemmi>=0.6"]
nlp = ["spacy>=3.7", "scispacy>=0.5"]
semantic = ["chromadb>=0.4", "sentence-transformers>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "pytest-asyncio>=0.24",
    "ruff>=0.3",
    "responses>=0.25",
    "mypy>=1.8",
    "pip-tools>=7.4",
]
all = [
    "med-research[ml,cheminformatics,nlp,semantic,dev]",
]

[project.scripts]
med-research = "med_research.cli:main"
nosograph = "med_research.cli:nosograph_main"

[project.urls]
Homepage = "https://github.com/AdamEddahmouni/nosograph"
Repository = "https://github.com/AdamEddahmouni/nosograph"
Documentation = "https://github.com/AdamEddahmouni/nosograph#readme"
Issues = "https://github.com/AdamEddahmouni/nosograph/issues"
Changelog = "https://github.com/AdamEddahmouni/nosograph/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
med_research = [
    "diseases/*/data/*.json",
    "pipeline/*/data/*.json",
    "pipeline/knowledge_graph/data/**/*.json",
    "pipeline/matching_engine/config/*.yaml",
    "pipeline/pharmacogenomics/allele_definitions.json",
    "web/static/**/*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "W"]
# B008 (function-call argument defaults) is enforced via the B ruleset.
# Use Annotated[..., Depends(...)] for FastAPI dependencies.

[tool.ruff.lint.isort]
known-first-party = ["med_research"]

[tool.coverage.run]
source = ["src/med_research"]
omit = [
    # 10k+ scaffolded disease modules are data/config, not unit-test targets
    "src/med_research/diseases/*/config.py",
    "src/med_research/diseases/*/data/*",
    "src/med_research/diseases/disease_registry.json",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --color=auto -n auto --dist=loadscope"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "browser: deterministic Playwright UI tests (fixture-backed, no live APIs)",
    "unit: fast offline tests (explicit on test modules; auto-applied fallback in tests/conftest.py)",
    "integration: auto-applied under tests/integration/ (see tests/integration/conftest.py)",
    "network: requires live external APIs (excluded from the PR docking check)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
