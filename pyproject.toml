[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "med-research"
version = "2.0.0"
description = "Multi-disease computational drug discovery and research platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Medical Research Platform"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.83",
    "celery>=5.3",
    "fastapi>=0.109",
    "gseapy>=1.1",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "pydantic>=2.5",
    "Jinja2>=3.1",
    "redis>=5.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "uvicorn>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "shap>=0.44"]
cheminformatics = ["rdkit>=2023.09", "meeko>=0.5", "gemmi>=0.6"]
nlp = ["spacy>=3.7", "scispacy>=0.5"]
semantic = ["chromadb>=0.4", "sentence-transformers>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "responses>=0.25",
    "mypy>=1.8",
    "pip-tools>=7.4",
]
all = [
    "med-research[ml,cheminformatics,nlp,semantic,dev]",
]

[project.scripts]
med-research = "med_research.cli:main"

[project.urls]
Repository = "https://github.com/medical-research"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
med_research = [
    "diseases/*/data/*.json",
    "pipeline/*/data/*.json",
    "pipeline/knowledge_graph/data/**/*.json",
    "web/static/**/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "W"]
# B008 (function-call argument defaults) is enforced via the B ruleset.
# Use Annotated[..., Depends(...)] for FastAPI dependencies.

[tool.ruff.lint.isort]
known-first-party = ["med_research"]

[tool.coverage.run]
source = ["src/med_research"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --color=auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: auto-applied to non-slow, non-integration tests (see tests/conftest.py)",
    "integration: auto-applied under tests/integration/ (see tests/integration/conftest.py)",
    "network: requires live external APIs (excluded from the PR docking check)",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
