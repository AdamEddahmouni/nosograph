# ── Medical Research Platform — Docker Compose ───────────────────────────
#
# Usage:
#   docker compose build                          Build the image
#   docker compose up web                          Start the web API + dashboard
#   docker compose run --rm pipeline run-all      Run the full pipeline
#   docker compose run --rm pipeline test          Run tests
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis (message broker + result backend for Celery) ────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Celery Worker ─────────────────────────────────────────────────────
  worker:
    build: .
    image: med-research:latest
    command: celery -A med_research.web.tasks.analysis_tasks worker --loglevel=info --concurrency=2
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - disease-data:/app/src/med_research/diseases:ro
      - pipeline-data:/app/src/med_research/pipeline
    profiles:
      - full

  # ── Web API + Dashboard ───────────────────────────────────────────────
  web:
    build: .
    image: med-research:latest
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CACHE=true
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - disease-data:/app/src/med_research/diseases:ro
      - pipeline-data:/app/src/med_research/pipeline
    profiles:
      - full

  # ── CLI pipeline ──────────────────────────────────────────────────────
  pipeline:
    build: .
    image: med-research:latest
    entrypoint: ["python", "-m", "med_research.cli"]
    volumes:
      - disease-data:/app/src/med_research/diseases:ro
      - pipeline-data:/app/src/med_research/pipeline
    profiles:
      - cli

volumes:
  redis-data:
  disease-data:
  pipeline-data:
