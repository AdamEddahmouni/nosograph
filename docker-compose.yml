# ── NosoGraph — Docker Compose ───────────────────────────────────────────
#
# Evaluation:
#   cp .env.example .env
#   docker compose --profile full up --build
#   open http://localhost:8000
#
# Image tag `med-research:latest` is an internal/compatibility name (Python
# distribution `med-research`), not public product branding. Compose project
# name is `nosograph` so evaluation containers are nosograph-* rather than
# inheriting the local checkout directory name.
# Local builds skip the 10k-module strict validation gate by default
# (DOCKER_SKIP_DISEASE_VALIDATE=1). That is not a production security bypass.
#
# Usage:
#   docker compose build                          Build the image
#   docker compose --profile full up web          Start the web API + dashboard
#   docker compose --profile full up worker       Start the Celery worker
#   docker compose run --rm pipeline run-all      Run the full pipeline
#   docker compose run --rm pipeline test          Run tests
#
# Runtime data (caches, workspace DB, pipeline outputs) persists under ./data
# mounted at /app/data inside containers. Override PORT to change the host port.
#
# ─────────────────────────────────────────────────────────────────────────────

name: nosograph

services:

  # ── Redis (message broker + result backend for Celery) ────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Celery Worker ─────────────────────────────────────────────────────
  worker:
    build:
      context: .
      args:
        DOCKER_SKIP_DISEASE_VALIDATE: ${DOCKER_SKIP_DISEASE_VALIDATE:-1}
    image: med-research:latest
    entrypoint: ["celery"]
    command: ["-A", "med_research.web.tasks.analysis_tasks", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALERT_SMTP_HOST=${ALERT_SMTP_HOST:-}
      - ALERT_SMTP_PORT=${ALERT_SMTP_PORT:-587}
      - ALERT_SMTP_USERNAME=${ALERT_SMTP_USERNAME:-}
      - ALERT_SMTP_PASSWORD=${ALERT_SMTP_PASSWORD:-}
      - ALERT_SMTP_FROM=${ALERT_SMTP_FROM:-}
      - ALERT_SMTP_USE_TLS=${ALERT_SMTP_USE_TLS:-true}
      - WORKSPACE_PUBLIC_URL=${WORKSPACE_PUBLIC_URL:-http://localhost:8000}
      - WORKSPACE_REVIEW_LINK_SECRET=${WORKSPACE_REVIEW_LINK_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      disable: true
    profiles:
      - full

  # ── Celery Beat — weekly digest scheduler ────────────────────────────
  beat:
    build:
      context: .
      args:
        DOCKER_SKIP_DISEASE_VALIDATE: ${DOCKER_SKIP_DISEASE_VALIDATE:-1}
    image: med-research:latest
    entrypoint: ["celery"]
    command: ["-A", "med_research.web.tasks.analysis_tasks", "beat", "--loglevel=info"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALERT_SMTP_HOST=${ALERT_SMTP_HOST:-}
      - ALERT_SMTP_PORT=${ALERT_SMTP_PORT:-587}
      - ALERT_SMTP_USERNAME=${ALERT_SMTP_USERNAME:-}
      - ALERT_SMTP_PASSWORD=${ALERT_SMTP_PASSWORD:-}
      - ALERT_SMTP_FROM=${ALERT_SMTP_FROM:-}
      - ALERT_SMTP_USE_TLS=${ALERT_SMTP_USE_TLS:-true}
      - WORKSPACE_PUBLIC_URL=${WORKSPACE_PUBLIC_URL:-http://localhost:8000}
      - WORKSPACE_REVIEW_LINK_SECRET=${WORKSPACE_REVIEW_LINK_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      disable: true
    profiles:
      - full

  # ── Web API + Dashboard ───────────────────────────────────────────────
  web:
    build:
      context: .
      args:
        DOCKER_SKIP_DISEASE_VALIDATE: ${DOCKER_SKIP_DISEASE_VALIDATE:-1}
    image: med-research:latest
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - DEBUG=${DEBUG:-true}
      - API_KEY=${API_KEY:-}
      - AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_RATE_LIMIT_URL=redis://redis:6379/0
      - USE_CACHE=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\", \"8000\")}/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - ./data:/app/data
    profiles:
      - full

  # ── CLI pipeline ──────────────────────────────────────────────────────
  pipeline:
    build:
      context: .
      args:
        DOCKER_SKIP_DISEASE_VALIDATE: ${DOCKER_SKIP_DISEASE_VALIDATE:-1}
    image: med-research:latest
    entrypoint: ["python", "-m", "med_research.cli"]
    volumes:
      - ./data:/app/data
    profiles:
      - cli

volumes:
  redis-data:
